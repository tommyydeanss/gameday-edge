name: Update GameDay Edge board

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours: stats, DailyFaceoff lines, goalies, projections (no odds credits)
    - cron: "5,25,45 13-23 * * *"   # daytime checks: the first run at or after the day's odds time pulls Hard Rock odds (once a day); the rest stop early
  workflow_dispatch:
    inputs:
      odds:
        description: "Also pull Hard Rock odds for today's games (uses Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write     # lets the run save the results-tracking files (tracking/ folder, not part of the web page)
  pages: write
  id-token: write

concurrency:
  group: gameday-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      skip: ${{ steps.mode.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Keep downloaded season stats and earlier odds between runs (so non-odds runs still show the 3 PM odds)
      - uses: actions/cache/restore@v4
        with:
          path: .nfl_cache
          key: board-cache-${{ github.run_id }}
          restore-keys: board-cache-

      - name: Decide whether this run buys odds
        id: mode
        env:
          SCHED: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.odds }}
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import os, sys, csv, io, datetime, zoneinfo
          import requests
          s, manual = os.environ.get("SCHED", ""), os.environ.get("MANUAL", "")
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.datetime.now(ET)
          day = f"{now:%Y-%m-%d}"
          # GitHub often starts scheduled runs late, so odds are bought by the clock, not by which schedule fired.
          # Odds time = 2:45 PM Eastern, or 90 minutes before the day's first NHL/NFL game if that is earlier
          # (never before 9:00 AM). The first run at or after it buys; a marker file stops a second purchase that day.
          starts = []
          try:
              wk = requests.get(f"https://api-web.nhle.com/v1/schedule/{day}", timeout=20).json().get("gameWeek", [])
              for d in wk:
                  if d.get("date") == day:
                      for g in d.get("games", []):
                          if g.get("gameType") in (2, 3):
                              t = datetime.datetime.fromisoformat(g["startTimeUTC"].replace("Z", "+00:00")).astimezone(ET)
                              starts.append(t.hour * 60 + t.minute)
          except Exception as e:
              print("NHL schedule check failed:", e, file=sys.stderr)
          try:
              txt = requests.get("https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv", timeout=30).text
              for g in csv.DictReader(io.StringIO(txt)):
                  if g.get("gameday") == day and g.get("gametime"):
                      h, m = g["gametime"].split(":")[:2]
                      starts.append(int(h) * 60 + int(m))
          except Exception as e:
              print("NFL schedule check failed:", e, file=sys.stderr)
          target = 14 * 60 + 45
          if starts:
              target = max(9 * 60, min(target, min(starts) - 90))
          print(f"first game {min(starts) if starts else None} min, odds time {target // 60}:{target % 60:02d} ET", file=sys.stderr)
          bought = os.path.exists(f".nfl_cache/odds_bought_{day}")
          due = now.hour * 60 + now.minute >= target
          odds = manual == "true" or (bool(s) and due and not bought)
          skip = not odds and s == "5,25,45 13-23 * * *"
          print("odds=" + ("yes" if odds else "no"))
          print("skip=" + ("yes" if skip else "no"))
          PY

      - name: Build the board
        if: steps.mode.outputs.skip != 'yes'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.odds }}" = "yes" ] && [ -n "$ODDS_API_KEY" ]; then
            python nfl_board.py --no-open --shared --odds-today --out site/index.html
            mkdir -p .nfl_cache && rm -f .nfl_cache/odds_bought_* && touch ".nfl_cache/odds_bought_$(TZ=America/New_York date +%F)"
          else
            python nfl_board.py --no-open --shared --no-odds --out site/index.html
          fi

      # Results tracking: kept in the repository's tracking/ folder, never published on the site
      - name: Update results tracking
        if: steps.mode.outputs.skip != 'yes'
        continue-on-error: true     # a tracking hiccup must never stop the board from publishing
        run: |
          python track.py site/index.html tracking
          git config user.name "gameday-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking
          if ! git diff --cached --quiet; then
            git commit -m "Update results tracking"
            git pull --rebase
            git push
          fi

      - uses: actions/cache/save@v4
        if: always() && steps.mode.outputs.skip != 'yes'
        with:
          path: .nfl_cache
          key: board-cache-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.skip != 'yes'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
